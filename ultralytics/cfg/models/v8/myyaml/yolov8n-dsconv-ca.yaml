# Ultralytics YOLOv8 自定义模型：C2f_DSConv + Coordinate Attention
# 融合：Backbone/Head 使用 C2f_DSConv，P3/P4/P5 后插入 CoordAtt

nc: 80  # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 1-P2/4
  - [-1, 3, C2f_DSConv, [128, True]]         # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3-P3/8
  - [-1, 6, C2f_DSConv, [256, True]]         # 4
  - [-1, 1, CoordAtt, []]                    # 5 (P3 注意力)
  - [-1, 1, Conv, [512, 3, 2]]              # 6-P4/16
  - [-1, 6, C2f_DSConv, [512, True]]         # 7
  - [-1, 1, CoordAtt, []]                    # 8 (P4 注意力)
  - [-1, 1, Conv, [1024, 3, 2]]             # 9-P5/32
  - [-1, 3, C2f_DSConv, [1024, True]]        # 10
  - [-1, 1, CoordAtt, []]                    # 11 (P5 注意力)
  - [-1, 1, SPPF, [1024, 5]]                # 12

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 13
  - [[-1, 8], 1, Concat, [1]]                    # 14 cat backbone P4 (CoordAtt 512)
  - [-1, 3, C2f_DSConv, [512]]                   # 15

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 16
  - [[-1, 5], 1, Concat, [1]]                    # 17 cat backbone P3 (CoordAtt 256)
  - [-1, 3, C2f_DSConv, [256]]                   # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                   # 19
  - [[-1, 15], 1, Concat, [1]]                   # 20 cat head P4
  - [-1, 3, C2f_DSConv, [512]]                   # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                   # 22
  - [[-1, 12], 1, Concat, [1]]                   # 23 cat head P5
  - [-1, 3, C2f_DSConv, [1024]]                  # 24 (P5/32-large)

  - [[18, 21, 24], 1, Detect, [nc]]              # 25 Detect(P3, P4, P5)